<!-- Load Tailwind with fallback CDNs (some school networks block one CDN but allow another) -->
<script>
(function () {
  var TAILWIND_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css',
    'https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css'
  ];
  var TAILWIND_RUNTIME = [
    'https://cdn.tailwindcss.com',
    'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'
  ];
  window.__cqCdn = window.__cqCdn || { tailwind: 'pending', react: 'pending', reactDom: 'pending' };
  var i = 0;
  function tryNext() {
    if (i >= TAILWIND_RUNTIME.length) { window.__cqCdn.tailwind = 'failed'; return; }
    var s = document.createElement('script');
    s.src = TAILWIND_RUNTIME[i++];
    s.onload = function () { window.__cqCdn.tailwind = 'ok:' + s.src; };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<script>
  tailwind.config = {
    darkMode: ['class', '.cq-dark'],
    theme: {
      extend: {
        colors: {

<style>
  /* ============================
     THEME VARIABLES
     ============================ */
  :root {
    --cq-font-sans: 'Inter';
    --cq-font-display: '"Plus Jakarta Sans"';
  }

  /* PLAYFUL — bright violet + mint, friendly */
  html[data-theme="playful"].cq-light {
    --cq-bg:      hsl(252 100% 99%);
    --cq-surface: hsl(0 0% 100%);
    --cq-sunken:  hsl(252 40% 96%);
    --cq-ink:     hsl(252 40% 12%);
    --cq-muted:   hsl(252 12% 45%);
    --cq-line:    hsl(252 30% 92%);
    --cq-primary: hsl(258 89% 60%);
    --cq-accent:  hsl(160 84% 42%);
    --cq-warn:    hsl(38 92% 55%);
    --cq-danger:  hsl(0 84% 60%);
    --cq-success: hsl(142 70% 42%);
    --cq-shadow-card: 0 1px 2px hsl(252 40% 12% / .04), 0 10px 30px hsl(258 60% 40% / .08);
    --cq-shadow-glow: 0 10px 40px hsl(258 89% 60% / .25);
    --cq-hero-gradient: radial-gradient(ellipse at top, hsl(258 89% 95%) 0%, hsl(252 100% 99%) 60%);
  }
  html[data-theme="playful"].cq-dark {
    --cq-bg:      hsl(252 30% 8%);
    --cq-surface: hsl(252 25% 12%);
    --cq-sunken:  hsl(252 25% 10%);
    --cq-ink:     hsl(252 30% 96%);
    --cq-muted:   hsl(252 12% 65%);
    --cq-line:    hsl(252 25% 20%);
    --cq-primary: hsl(258 89% 68%);
    --cq-accent:  hsl(160 70% 55%);
    --cq-warn:    hsl(38 92% 60%);
    --cq-danger:  hsl(0 84% 65%);
    --cq-success: hsl(142 60% 55%);
    --cq-shadow-card: 0 1px 2px hsl(0 0% 0% / .4), 0 10px 30px hsl(258 60% 5% / .5);
    --cq-shadow-glow: 0 10px 40px hsl(258 89% 60% / .35);
    --cq-hero-gradient: radial-gradient(ellipse at top, hsl(258 50% 18%) 0%, hsl(252 30% 8%) 60%);
  }

  /* NEON — cyberpunk dark with cyan/magenta */
  html[data-theme="neon"] {
    --cq-font-sans: '"JetBrains Mono"';
    --cq-font-display: '"JetBrains Mono"';
    --cq-bg:      hsl(240 30% 5%);
    --cq-surface: hsl(240 25% 9%);
    --cq-sunken:  hsl(240 25% 7%);
    --cq-ink:     hsl(180 100% 92%);
    --cq-muted:   hsl(220 20% 60%);
    --cq-line:    hsl(280 50% 25%);
    --cq-primary: hsl(180 100% 50%);
    --cq-accent:  hsl(320 100% 60%);
    --cq-warn:    hsl(50 100% 55%);
    --cq-danger:  hsl(0 100% 60%);
    --cq-success: hsl(135 100% 55%);
    --cq-shadow-card: 0 0 1px hsl(180 100% 50% / .6), 0 0 30px hsl(320 100% 60% / .15);
    --cq-shadow-glow: 0 0 30px hsl(180 100% 50% / .6);
    --cq-hero-gradient: radial-gradient(ellipse at top, hsl(280 60% 15%) 0%, hsl(240 30% 5%) 60%);
  }

  /* RETRO — pixel/CRT amber-green */
  html[data-theme="retro"] {
    --cq-font-sans: 'VT323';
    --cq-font-display: 'VT323';
    --cq-bg:      hsl(35 30% 8%);
    --cq-surface: hsl(35 25% 12%);
    --cq-sunken:  hsl(35 25% 10%);
    --cq-ink:     hsl(50 100% 70%);
    --cq-muted:   hsl(50 50% 55%);
    --cq-line:    hsl(120 40% 25%);
    --cq-primary: hsl(120 70% 55%);
    --cq-accent:  hsl(35 100% 60%);
    --cq-warn:    hsl(50 100% 55%);
    --cq-danger:  hsl(0 100% 65%);
    --cq-success: hsl(120 80% 55%);
    --cq-shadow-card: 0 0 1px hsl(120 70% 55% / .8), inset 0 0 60px hsl(0 0% 0% / .3);
    --cq-shadow-glow: 0 0 20px hsl(120 70% 55% / .5);
    --cq-hero-gradient: radial-gradient(ellipse at top, hsl(120 40% 12%) 0%, hsl(35 30% 8%) 60%);
  }
  html[data-theme="retro"] body { letter-spacing: 0.5px; }
  html[data-theme="retro"]::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, hsl(0 0% 0% / .06) 2px, hsl(0 0% 0% / .06) 3px);
  }

  /* MINIMAL — quiet near-monochrome */
  html[data-theme="minimal"].cq-light {
    --cq-bg:      hsl(40 20% 98%);
    --cq-surface: hsl(0 0% 100%);
    --cq-sunken:  hsl(40 15% 95%);
    --cq-ink:     hsl(0 0% 9%);
    --cq-muted:   hsl(0 0% 45%);
    --cq-line:    hsl(0 0% 90%);
    --cq-primary: hsl(0 0% 9%);
    --cq-accent:  hsl(20 80% 55%);
    --cq-warn:    hsl(38 92% 55%);
    --cq-danger:  hsl(0 70% 50%);
    --cq-success: hsl(150 50% 35%);
    --cq-shadow-card: 0 0 0 1px hsl(0 0% 90%);
    --cq-shadow-glow: 0 0 0 2px hsl(0 0% 9%);
    --cq-hero-gradient: linear-gradient(180deg, hsl(40 20% 98%), hsl(40 15% 96%));
  }
  html[data-theme="minimal"].cq-dark {
    --cq-bg:      hsl(0 0% 6%);
    --cq-surface: hsl(0 0% 10%);
    --cq-sunken:  hsl(0 0% 8%);
    --cq-ink:     hsl(0 0% 96%);
    --cq-muted:   hsl(0 0% 60%);
    --cq-line:    hsl(0 0% 20%);
    --cq-primary: hsl(0 0% 96%);
    --cq-accent:  hsl(20 80% 60%);
    --cq-warn:    hsl(38 92% 60%);
    --cq-danger:  hsl(0 70% 60%);
    --cq-success: hsl(150 50% 55%);
    --cq-shadow-card: 0 0 0 1px hsl(0 0% 20%);
    --cq-shadow-glow: 0 0 0 2px hsl(0 0% 96%);
    --cq-hero-gradient: linear-gradient(180deg, hsl(0 0% 6%), hsl(0 0% 8%));
  }

  /* GLOBAL */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--cq-bg); color: var(--cq-ink); }
  body { font-family: var(--cq-font-sans), 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: var(--cq-font-display), 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  .hero-bg { background: var(--cq-hero-gradient); }

  /* ANIMATIONS */
  @keyframes pop      { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  @keyframes slideUp  { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes shake    { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 hsl(258 89% 60% / .5)} 50%{box-shadow:0 0 0 14px hsl(258 89% 60% / 0)} }
  @keyframes flame    { 0%,100%{transform:scale(1) rotate(-2deg)} 50%{transform:scale(1.08) rotate(3deg)} }
  @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes spin-slow{ to{transform:rotate(360deg)} }
  @keyframes confetti-fall { to{transform:translateY(110vh) rotate(720deg);opacity:0} }
  @keyframes star-burst { 0%{transform:scale(.3);opacity:1} 100%{transform:scale(1.6);opacity:0} }
  @keyframes xp-rise { 0%{transform:translateY(0) scale(.8);opacity:0} 15%{transform:translateY(-10px) scale(1.1);opacity:1} 100%{transform:translateY(-90px) scale(1);opacity:0} }
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1)} }
  @keyframes bounce-happy { 0%,100%{transform:translateY(0) rotate(0)} 30%{transform:translateY(-14px) rotate(-6deg)} 60%{transform:translateY(-4px) rotate(4deg)} }
  @keyframes wiggle-sad { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(2px) rotate(-3deg)} 75%{transform:translateY(2px) rotate(3deg)} }
  @keyframes tilt-hover { 0%{transform:perspective(800px) rotateX(0) rotateY(0)} 100%{transform:perspective(800px) rotateX(2deg) rotateY(-3deg)} }
  @keyframes count-up { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes shimmer-bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @keyframes combo-pop  { 0%{transform:scale(.4) rotate(-12deg);opacity:0} 60%{transform:scale(1.15) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
  @keyframes ring-grow  { 0%{transform:scale(.6);opacity:.7} 100%{transform:scale(1.8);opacity:0} }
  @keyframes drift      { 0%{transform:translate(0,0)} 50%{transform:translate(8px,-12px)} 100%{transform:translate(0,0)} }

  .anim-xp-rise   { animation: xp-rise 1.2s ease-out forwards; }
  .anim-sparkle   { animation: sparkle 1s ease-in-out infinite; }
  .anim-happy     { animation: bounce-happy .8s cubic-bezier(.34,1.56,.64,1); }
  .anim-sad       { animation: wiggle-sad .55s ease-in-out 2; }
  .anim-count     { animation: count-up .35s ease-out both; }
  .anim-combo     { animation: combo-pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .anim-ring-grow { animation: ring-grow .9s ease-out forwards; }
  .anim-drift     { animation: drift 18s ease-in-out infinite; }

  /* Glassmorphism card variant */
  .glass {
    background: linear-gradient(135deg, hsl(0 0% 100% / .55) 0%, hsl(0 0% 100% / .25) 100%);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid hsl(0 0% 100% / .35);
  }
  .cq-dark .glass {
    background: linear-gradient(135deg, hsl(252 30% 15% / .65) 0%, hsl(252 30% 10% / .5) 100%);
    border: 1px solid hsl(0 0% 100% / .08);
  }
  html[data-theme="neon"] .glass {
    background: linear-gradient(135deg, hsl(280 60% 15% / .6) 0%, hsl(240 30% 7% / .8) 100%);
    border: 1px solid hsl(180 100% 50% / .25);
  }

  /* Tilt effect for cards on hover (subtle, desktop only) */
  @media (hover:hover) {
    .tilt:hover { transform: perspective(900px) translateY(-3px) rotateX(2deg) rotateY(-2deg); }
  }
  .tilt { transition: transform .35s cubic-bezier(.2,.8,.2,1); }

  /* Floating XP container */
  .xp-float {
    position: absolute; pointer-events: none; z-index: 60;
    font-weight: 800; font-size: 1.5rem;
    color: var(--cq-success);
    text-shadow: 0 2px 12px hsl(142 76% 45% / .5);
  }

  /* Sparkles around correct answers */
  .sparkle {
    position:absolute; width:6px; height:6px;
    background: radial-gradient(circle, white 0%, transparent 70%);
    pointer-events:none;
  }

  /* Combo banner */
  .combo-banner {
    position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(90deg, var(--cq-primary), var(--cq-accent));
    color: white; font-weight: 800; font-family: var(--cq-font-display);
    padding: .5rem 1.2rem; border-radius: 999px;
    box-shadow: var(--cq-shadow-glow);
    z-index: 70; letter-spacing: .02em;
  }

  /* Drag-and-drop visual states for ordering */
  .drag-item   { cursor: grab; }
  .drag-item:active { cursor: grabbing; }
  .drag-dragging { opacity: .4; }
  .drag-over   { outline: 3px dashed var(--cq-primary); outline-offset: -3px; background: var(--cq-sunken); }

  /* Animated gradient backgrounds for hero cards */
  .gradient-flow {
    background: linear-gradient(120deg, var(--cq-primary), var(--cq-accent), var(--cq-warn), var(--cq-primary));
    background-size: 300% 300%;
    animation: shimmer-bg 8s ease infinite;
  }

  /* Subtle background particles */
  .bg-particles { position: absolute; inset:0; pointer-events: none; overflow:hidden; }
  .bg-particles span {
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: var(--cq-primary); opacity:.12; animation: drift 24s ease-in-out infinite;
  }

  /* Streak counter inside quiz */
  .streak-meter {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .6rem; border-radius: 999px;
    background: linear-gradient(90deg, var(--cq-warn), var(--cq-danger));
    color: white; font-weight: 800;
    box-shadow: 0 4px 16px hsl(38 92% 55% / .35);
  }

  /* ============================================================
     INLINE TAILWIND FALLBACK — hand-written utilities so the app
     looks correct even when Tailwind's CDN is blocked (school firewalls).
     Tailwind loads on top and overrides where present.
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }

  /* Display */

  .-mt-6 { margin-top: -1.5rem; }

  .-mr-8 { margin-right: -2rem; }
  .-right-2 { right: -.5rem; }
  .space-y-1 > * + * { margin-top: .25rem; }
  .space-y-2 > * + * { margin-top: .5rem; }
  .divide-y > * + * { border-top: 1px solid var(--cq-line); }
  .divide-line > * + * { border-color: var(--cq-line); }

  /* Text */
  .text-xs { font-size: .75rem; line-height: 1.25; }
  .text-sm { font-size: .875rem; line-height: 1.35; }
  .text-base { font-size: 1rem; line-height: 1.5; }
  .text-lg { font-size: 1.125rem; line-height: 1.4; }
  .text-xl { font-size: 1.25rem; line-height: 1.4; }
  .text-2xl { font-size: 1.5rem; line-height: 1.3; }
  .text-3xl { font-size: 1.875rem; line-height: 1.2; }
  .text-4xl { font-size: 2.25rem; line-height: 1.15; }
  .text-5xl { font-size: 3rem; line-height: 1.1; }
  .text-6xl { font-size: 3.75rem; line-height: 1; }
  .text-\[10px\] { font-size: 10px; }
  .text-\[11px\] { font-size: 11px; }
  .text-left { text-align: left; } .text-center { text-align: center; } .text-right { text-align: right; }
  .font-normal { font-weight: 400; } .font-medium { font-weight: 500; }
  .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .leading-tight { line-height: 1.2; } .leading-snug { line-height: 1.35; }
  .leading-relaxed { line-height: 1.65; } .leading-none { line-height: 1; }
  .whitespace-pre-wrap { white-space: pre-wrap; } .whitespace-pre { white-space: pre; }
  .capitalize { text-transform: capitalize; } .uppercase { text-transform: uppercase; }
  .tracking-widest { letter-spacing: .1em; }
  .text-white { color: white; }
  .text-primary { color: var(--cq-primary); }
  .text-accent  { color: var(--cq-accent); }
  .text-muted   { color: var(--cq-muted); }
  .text-ink     { color: var(--cq-ink); }
  .text-danger  { color: var(--cq-danger); }
  .text-success { color: var(--cq-success); }
  .text-warn    { color: var(--cq-warn); }
  .hover\:text-ink:hover { color: var(--cq-ink); }
  .hover\:underline:hover { text-decoration: underline; }

  /* Background */
  .bg-primary { background-color: var(--cq-primary); }
  .bg-accent  { background-color: var(--cq-accent); }
  .bg-surface { background-color: var(--cq-surface); }
  .bg-sunken  { background-color: var(--cq-sunken); }
  .bg-line    { background-color: var(--cq-line); }
  .bg-bg      { background-color: var(--cq-bg); }
  .bg-danger  { background-color: var(--cq-danger); }
  .bg-success { background-color: var(--cq-success); }
  .bg-warn    { background-color: var(--cq-warn); }
  .bg-transparent { background: transparent; }
  .bg-bg\/80 { background-color: var(--cq-bg); }
  .hover\:bg-sunken:hover { background-color: var(--cq-sunken); }
  .backdrop-blur-xl { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

  /* Border */
  .border { border: 1px solid var(--cq-line); }
  .border-2 { border-width: 2px; border-style: solid; border-color: var(--cq-line); }
  .border-t { border-top: 1px solid var(--cq-line); }
  .border-b { border-bottom: 1px solid var(--cq-line); }
  .border-l { border-left: 1px solid var(--cq-line); }
  .border-line { border-color: var(--cq-line); }
  .border-primary { border-color: var(--cq-primary); }
  .border-accent  { border-color: var(--cq-accent); }
  .border-danger  { border-color: var(--cq-danger); }
  .border-success { border-color: var(--cq-success); }
  .border-warn    { border-color: var(--cq-warn); }
  .border-muted   { border-color: var(--cq-muted); }
  .hover\:border-primary:hover { border-color: var(--cq-primary); }

  /* Radius */
  .rounded    { border-radius: .375rem; }
  .rounded-md { border-radius: .375rem; }
  .rounded-lg { border-radius: .5rem; }
  .rounded-xl { border-radius: .75rem; }
  .rounded-2xl { border-radius: 1rem; }
  .rounded-3xl { border-radius: 1.5rem; }
  .rounded-full { border-radius: 9999px; }
  .rounded-card { border-radius: 20px; }
  .rounded-pill { border-radius: 999px; }

  /* Position */
  .relative { position: relative; }
  .absolute { position: absolute; }
  .fixed    { position: fixed; }
  .sticky   { position: sticky; }
  .top-0    { top: 0; }
  .top-3    { top: .75rem; }
  .right-0  { right: 0; }
  .right-3  { right: .75rem; }
  .left-0   { left: 0; }
  .bottom-0 { bottom: 0; }
  .inset-0  { top: 0; right: 0; bottom: 0; left: 0; }
  .z-10 { z-index: 10; } .z-20 { z-index: 20; } .z-30 { z-index: 30; }

  /* Overflow */
  .overflow-hidden { overflow: hidden; } .overflow-auto { overflow: auto; }
  .overflow-x-auto { overflow-x: auto; } .overflow-y-auto { overflow-y: auto; }

  /* Opacity */
  .opacity-0 { opacity: 0; } .opacity-40 { opacity: .4; }
  .opacity-50 { opacity: .5; } .opacity-70 { opacity: .7; } .opacity-90 { opacity: .9; }

  /* Cursor */
  .cursor-pointer { cursor: pointer; } .cursor-not-allowed { cursor: not-allowed; }

  /* Transitions */
  .transition { transition: all .2s ease; }
  .transition-all { transition: all .2s ease; }
  .duration-200 { transition-duration: .2s; }
  .duration-700 { transition-duration: .7s; }

  /* Transforms */
  .transform { transform: translateZ(0); }
  .-translate-y-1 { transform: translateY(-.25rem); }
  .hover\:-translate-y-1:hover { transform: translateY(-.25rem); }
  .-rotate-90 { transform: rotate(-90deg); }
  .scale-125 { transform: scale(1.25); }

  /* Shadows (map to existing tokens) */
  .shadow      { box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .shadow-lg   { box-shadow: 0 10px 24px rgba(0,0,0,.12); }
  .shadow-card { box-shadow: var(--cq-shadow-card); }
  .shadow-glow { box-shadow: var(--cq-shadow-glow); }

  /* Font families */
  .font-display { font-family: var(--cq-font-display), 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  .font-sans    { font-family: var(--cq-font-sans), 'Inter', system-ui, sans-serif; }

  /* Buttons — reset native */
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:disabled { cursor: not-allowed; }

  /* Inputs / textarea — reset native, our .input helper is defined elsewhere */
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

  /* Table (used in Teacher dashboard) */
  table { border-collapse: collapse; }

  /* Grayscale filter */
  .grayscale { filter: grayscale(1); }

  /* Larger touch targets on mobile */
  @media (max-width: 640px) {
    .choice { font-size: 1.02rem; }
    .btn-primary { padding: 1rem 1.4rem; }
  }

  /* ============================
     CHATBOT (QUANTA)
     ============================ */
  .cq-fab {
    position: fixed; bottom: 22px; right: 22px;
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(135deg, var(--cq-primary), var(--cq-accent));
    color: white; font-size: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--cq-shadow-glow);
    z-index: 80; cursor: pointer; border: none;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .cq-fab:hover { transform: scale(1.08) rotate(-4deg); }
  .cq-fab::after {
    content:''; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid var(--cq-primary); opacity:.5;
    animation: pulse-glow 2.4s infinite;
  }

  .cq-bot-badge {
    position: absolute; top: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--cq-warn); color: white;
    font-size: 11px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }

  .cq-panel {
    position: fixed; bottom: 100px; right: 22px;
    width: 380px; max-width: calc(100vw - 44px);
    height: 560px; max-height: calc(100vh - 140px);
    background: var(--cq-surface);
    border: 1px solid var(--cq-line);
    border-radius: 22px;
    box-shadow: 0 24px 70px hsl(258 60% 20% / .35);
    z-index: 90;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (max-width: 480px) {
    .cq-panel { right: 12px; left: 12px; width: auto; bottom: 92px; }
  }

  .cq-panel-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--cq-primary), var(--cq-accent));
    color: white;
  }
  .cq-panel-header .name { font-family: var(--cq-font-display); font-weight: 800; }
  .cq-panel-header .role { font-size: .72rem; opacity: .85; }
  .cq-close-btn { margin-left: auto; background: rgba(255,255,255,.18); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .cq-close-btn:hover { background: rgba(255,255,255,.3); }

  .cq-messages {
    flex: 1; overflow-y: auto;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    background: var(--cq-bg);
  }
  .cq-msg {
    max-width: 86%; padding: 9px 13px; border-radius: 16px;
    line-height: 1.45; font-size: .92rem;
    white-space: pre-wrap; word-wrap: break-word;
    animation: slideUp .22s ease-out both;
  }
  .cq-msg-user { align-self: flex-end; background: var(--cq-primary); color: white; border-bottom-right-radius: 4px; }
  .cq-msg-bot  { align-self: flex-start; background: var(--cq-surface); border: 1px solid var(--cq-line); border-bottom-left-radius: 4px; }
  .cq-msg-bot strong { color: var(--cq-primary); }

  .cq-typing { display: inline-flex; align-items: center; gap: 4px; }
  .cq-typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--cq-muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .cq-typing span:nth-child(2) { animation-delay: .15s; }
  .cq-typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-bounce {
    0%,80%,100% { transform: scale(.6); opacity:.4; }
    40% { transform: scale(1); opacity:1; }
  }

  .cq-suggestions {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 12px 0;
    background: var(--cq-bg);
  }
  .cq-suggestions button {
    background: var(--cq-sunken); color: var(--cq-ink);
    border: 1px solid var(--cq-line); border-radius: 999px;
    font-size: .78rem; padding: 6px 10px; cursor: pointer;
    transition: all .15s;
  }
  .cq-suggestions button:hover { background: var(--cq-primary); color: white; border-color: var(--cq-primary); }

  .cq-input-row {
    display: flex; gap: 8px; padding: 10px 12px 12px;
    background: var(--cq-bg); border-top: 1px solid var(--cq-line);
  }
  .cq-input-row input {
    flex: 1; background: var(--cq-surface); color: var(--cq-ink);
    border: 1px solid var(--cq-line); border-radius: 12px;
    padding: .6rem .9rem; font-family: inherit; font-size: .92rem;
  }
  .cq-input-row input:focus { outline: none; border-color: var(--cq-primary); }
  .cq-send-btn {
    background: var(--cq-primary); color: white;
    border: none; border-radius: 12px;
    padding: 0 14px; font-weight: 700; cursor: pointer;
  }
  .cq-send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ============================
     PYTHON PRACTICE
     ============================ */
  .py-editor-wrap {
    position: relative;
    border: 2px solid var(--cq-line);
    border-radius: 14px;
    background: var(--cq-sunken);
    overflow: hidden;
    display: flex;
    transition: border-color .2s;
  }
  .py-editor-wrap:focus-within { border-color: var(--cq-primary); }

    padding: 12px 8px 12px 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--cq-muted);
    text-align: right;
    user-select: none;
    background: var(--cq-bg);
    border-right: 1px solid var(--cq-line);
    min-width: 40px;
    white-space: pre;
    overflow: hidden;
  }
  .py-textarea {
    flex: 1;
    padding: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--cq-ink);
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    tab-size: 4;
    -moz-tab-size: 4;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
    min-height: 200px;
  }
  .py-output {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    background: #0f172a;
    color: #d1fae5;
    padding: 14px 16px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
    min-height: 44px;
    line-height: 1.5;
    border: 1px solid #1e293b;
  }
  .py-output-header {
    display: flex; align-items: center; gap: 6px;
    color: #94a3b8;
    font-size: 11px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .py-output.error { color: #fecaca; background: #1a0f14; border-color: #4a1a1a; }
  .py-loading-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--cq-sunken); color: var(--cq-muted);
  }
  .py-loading-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--cq-warn);
    animation: pulse-dot 1.2s infinite;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .py-mastery-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .py-mastery-1 { background: hsl(45 90% 90%); color: hsl(30 80% 30%); }
  .py-mastery-2 { background: hsl(150 60% 90%); color: hsl(150 60% 25%); }
  .py-mastery-3 { background: hsl(160 70% 88%); color: hsl(160 70% 22%); }
  .py-mastery-4 { background: linear-gradient(135deg, hsl(50 100% 60%), hsl(15 90% 60%)); color: white; }
  .cq-dark .py-mastery-1 { background: hsl(30 40% 20%); color: hsl(45 70% 75%); }
  .cq-dark .py-mastery-2 { background: hsl(150 30% 18%); color: hsl(150 60% 70%); }
  .cq-dark .py-mastery-3 { background: hsl(160 30% 20%); color: hsl(160 60% 75%); }

  .py-conf-btn {
    padding: 8px 12px; border-radius: 12px;
    background: var(--cq-sunken); border: 2px solid var(--cq-line);
    cursor: pointer; font-weight: 600; font-size: 13px;
    transition: all .15s;
  }
  .py-conf-btn:hover { border-color: var(--cq-primary); }
  .py-conf-btn.active { background: var(--cq-primary); color: white; border-color: var(--cq-primary); }

  .py-hint-card {
    background: linear-gradient(135deg, hsl(45 100% 96%), hsl(45 100% 92%));
    border: 1px solid hsl(45 60% 70%);
    color: hsl(30 60% 25%);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .cq-dark .py-hint-card {
    background: linear-gradient(135deg, hsl(35 40% 18%), hsl(35 40% 14%));
    border-color: hsl(45 60% 40%);
    color: hsl(45 80% 80%);
  }

  .py-solution-card {
    background: linear-gradient(135deg, hsl(258 89% 96%), hsl(258 89% 92%));
    border: 1px solid hsl(258 60% 70%);
    padding: 12px;
    border-radius: 12px;
  }
  .cq-dark .py-solution-card {
    background: linear-gradient(135deg, hsl(258 40% 18%), hsl(258 40% 14%));
    border-color: hsl(258 60% 40%);
  }

  .py-progress-bar {
    height: 6px; background: var(--cq-sunken); border-radius: 999px; overflow: hidden;
  }
  .py-progress-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--cq-primary), var(--cq-accent));
    border-radius: 999px; transition: width .5s ease-out;
  }

  .py-pathway-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    transition: background .15s;
  }
  .py-pathway-item:hover:not(.locked) { background: var(--cq-sunken); }
  .py-pathway-item.locked { opacity: 0.45; }

  /* ============================
     BLOCK CODING STUDIO
     ============================ */
  .bc-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .bc-layout { grid-template-columns: 1fr; }
  }
  .bc-toolbox {
    background: var(--cq-surface);
    border: 1px solid var(--cq-line);
    border-radius: 14px;
    padding: 10px;
    max-height: 560px;
    overflow: auto;
    position: sticky;
    top: 70px;
  }
  @media (max-width: 720px) { .bc-toolbox { position: static; max-height: none; } }
  .bc-cats {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--cq-line);
  }
  .bc-cat {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 8px;
    font-size: 11px; font-weight: 700;
    border: 2px solid;
    border-radius: 10px;
    cursor: pointer;
    color: var(--cq-ink);
    background: transparent;
    white-space: nowrap;
  }
  .bc-cat.active { transform: scale(1.05); }
  .bc-catname { display: inline; }
  @media (max-width: 480px) { .bc-catname { display: none; } }
  .bc-palette {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 10px;
  }
  .bc-palette-block {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border: 2px solid;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    text-align: left;
    color: var(--cq-ink);
    position: relative;
    transition: transform .15s, box-shadow .15s;
  }
  .bc-palette-block:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .bc-target-hint {
    padding: 8px; border-top: 1px solid var(--cq-line); margin-top: 6px;
  }
  .bc-workspace {
    background: var(--cq-sunken);
    border: 2px dashed var(--cq-line);
    border-radius: 14px;
    padding: 12px;
    min-height: 400px;
  }
  .bc-ws-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .bc-ws-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bc-ws-body {
    display: flex; flex-direction: column; gap: 8px;
  }
  .bc-ws-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--cq-muted);
    font-size: 14px;
    border: 2px dashed var(--cq-line);
    border-radius: 12px;
    background: var(--cq-surface);
  }
  .bc-block-wrap { display: block; }
  .bc-block {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 2px solid;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.05);
    position: relative;
    animation: bc-pop .18s ease-out;
    font-weight: 600;
    font-size: 14px;
  }
  @keyframes bc-pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bc-block.bc-target { outline: 3px dashed var(--cq-primary); outline-offset: 3px; }
  .bc-notch {
    display: inline-block;
    width: 10px; height: 20px;
    border-radius: 4px 0 0 4px;
    margin-left: -6px;
  }
  .bc-body { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bc-btns { display: inline-flex; gap: 3px; }
  .bc-btns button {
    width: 24px; height: 24px;
    border: 1px solid var(--cq-line);
    background: var(--cq-surface);
    color: var(--cq-ink);
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    padding: 0;
  }
  .bc-btns button:hover:not(:disabled) { background: var(--cq-primary); color: white; border-color: var(--cq-primary); }
  .bc-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
  .bc-inline {
    padding: 3px 6px;
    border: 1px solid var(--cq-line);
    border-radius: 6px;
    background: var(--cq-surface);
    color: var(--cq-ink);
    font-size: 13px;
  }
  .bc-inline.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .bc-inline:focus { outline: 2px solid var(--cq-primary); outline-offset: -1px; border-color: var(--cq-primary); }
  .bc-op {
    padding: 3px 6px;
    border: 1px solid var(--cq-line);
    border-radius: 6px;

// Show any JS/Babel error on the boot screen instead of leaving it blank
(function () {
  var status = document.getElementById('cq-boot-status');
  var hint   = document.getElementById('cq-boot-hint');
  var errBox = document.getElementById('cq-boot-error');
  var stage  = 'libs';

  function showError(msg) {
    errBox.style.display = 'block';
    errBox.textContent = msg;
    if (status) status.textContent = 'Something went wrong.';
    if (hint) hint.innerHTML = 'Copy the error above and share it — that will help fix it. Or press <b>F12</b> → Console for more detail.';
  }
  window.addEventListener('error', function (e) {
    var s = 'ERROR: ' + (e.message || 'unknown');
    if (e.filename) s += '\n at ' + e.filename;
    if (e.lineno) s += ':' + e.lineno + (e.colno ? ':' + e.colno : '');
    showError(s);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('PROMISE REJECTION: ' + (e.reason && (e.reason.message || e.reason) || 'unknown'));
  });

  // Live CDN progress reporting (helps diagnose school-network blocks)
  function cdnDesc() {
    var c = window.__cqCdn || {};
    var lines = [];
    for (var k in c) if (Object.prototype.hasOwnProperty.call(c, k)) {
      var v = c[k];
      if (v === 'pending') lines.push('· ' + k + ': loading…');
      else if (v === 'failed') lines.push('✗ ' + k + ': BLOCKED');
      else lines.push('✓ ' + k + ': loaded');
    }
    return lines.join('\n');
  }
  var statusIv = setInterval(function () {
    if (!document.getElementById('cq-boot')) { clearInterval(statusIv); return; }
    var el = document.getElementById('cq-boot-status');
    if (el) el.innerHTML = 'Loading libraries…<br><span style="font-size:11px;color:#8a8798;white-space:pre-line">' + cdnDesc() + '</span>';
  }, 400);

  function waitFor(name, test, onReady) {
    var t0 = Date.now();
    (function check() {
      if (test()) return onReady(Date.now() - t0);
      if (Date.now() - t0 > 30000) {
        var c = window.__cqCdn || {};
        var blocked = [];
        for (var k in c) if (c[k] === 'failed') blocked.push(k);
        var msg = 'Timeout waiting for ' + name + '.\n\n' + cdnDesc();
        if (blocked.length) msg += '\n\nYour network is blocking one or more CDNs above. Ask your school IT to allow:\n · cdnjs.cloudflare.com\n · cdn.jsdelivr.net\n · unpkg.com\n\nOr open this file from a home network / phone hotspot.';
        showError(msg);
        return;
      }
      setTimeout(check, 200);
    })();
  }
  waitFor('React', function () { return window.React && window.ReactDOM; }, function (ms) {
    clearInterval(statusIv);
    if (status) status.textContent = 'Starting the app… (libraries loaded in ' + ms + 'ms)';
    var t0 = Date.now();
    var iv = setInterval(function () {
      if (!document.getElementById('cq-boot')) { clearInterval(iv); return; }
      if (Date.now() - t0 > 15000) {
        clearInterval(iv);
        showError('React loaded but the app never rendered. Press F12 → Console tab and share the first red error.');
      }
    }, 300);
  });
})();

function computeLevel(xp) {
  return 1 + Math.floor(Math.sqrt(xp / 50));
}
function xpForLevel(lvl) {
  return Math.pow(lvl - 1, 2) * 50;
}
function xpProgressInLevel(xp) {
  const lvl = computeLevel(xp);
  const cur = xpForLevel(lvl);
  const nxt = xpForLevel(lvl + 1);
  return {
    lvl,
    cur,
    nxt,
    pct: (xp - cur) / (nxt - cur)
  };
}

function fireConfetti({

} = {}) {
  const colors = palette || ['#7c3aed', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4'];

  for (let i = 0; i < count; i++) {

    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];

    root.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

/* ============================================================
   QUESTION ENGINE
   ============================================================ */
// Fisher-Yates shuffle (in-place)
function fyShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Randomise answer-option order for MC questions (and remap the answer index).
// Other types keep their semantic ordering (TF, match, order, fitb).
function shuffleQuestion(q) {
  if (q.type !== 'mc' || !Array.isArray(q.options) || q.options.length < 2) return q;
  const indices = q.options.map((_, i) => i);
  fyShuffle(indices);
  return {
    ...q,
    options: indices.map(i => q.options[i]),
    answer: indices.indexOf(q.answer)
  };
}
function pickQuestionsFor(year, topicId, n = 15, seenIds = new Set(), targetDifficulty = 2) {
  const pool = QUESTIONS.filter(q => q.year === year && (!topicId || q.topic === topicId));
  const unseen = pool.filter(q => !seenIds.has(q.id));
  const source = unseen.length >= n ? unseen : pool;
  // Score combines difficulty match with strong randomness so each session feels fresh.
  const scored = source.map(q => ({
    q,
    s: -Math.abs(q.difficulty - targetDifficulty) * 0.5 + Math.random() * 2
  })).sort((a, b) => b.s - a.s);
  const picked = scored.slice(0, n).map(x => x.q);
  fyShuffle(picked); // randomise final order
  return picked.map(shuffleQuestion);
}
function pickDailyQuestion(year) {
  // Deterministic per day so all students get the same daily challenge
  const seed = parseInt(todayISO().replace(/-/g, ''));
  const pool = QUESTIONS.filter(q => q.year === year && q.difficulty >= 2);
  return shuffleQuestion(pool[seed % pool.length]);
}
function pickBossSet(year) {
  const pool = QUESTIONS.filter(q => q.year === year);
  const easy = pool.filter(q => q.difficulty <= 2);
  const med = pool.filter(q => q.difficulty === 3);
  const hard = pool.filter(q => q.difficulty >= 4);
  const sample = (arr, n) => fyShuffle([...arr]).slice(0, n);
  // 20 questions: 5 easy, 8 medium, 7 hard — escalating difficulty
  return [...sample(easy, 5), ...sample(med, 8), ...sample(hard, 7)].map(shuffleQuestion);
}

// --- Pyodide lazy loader --------------------------------------------
let _pyodide = null;
let _pyLoadPromise = null;
let _pyLoadState = 'idle'; // 'idle' | 'loading' | 'ready' | 'error'

function loadPyodideOnce() {
  if (_pyodide) return Promise.resolve(_pyodide);
  if (_pyLoadPromise) return _pyLoadPromise;
  _pyLoadState = 'loading';
  _pyLoadPromise = new Promise((resolve, reject) => {
    const base = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
    const start = () => {
      window.loadPyodide({
        indexURL: base
      }).then(py => {
        _pyodide = py;
        _pyLoadState = 'ready';
        resolve(py);
      }).catch(err => {
        _pyLoadState = 'error';
        reject(err);
      });
    };
    if (window.loadPyodide) {
      start();
      return;
    }
    const s = document.createElement('script');
    s.src = base + 'pyodide.js';
    s.onload = start;
    s.onerror = () => {
      _pyLoadState = 'error';
      reject(new Error('Could not load the Python runtime (offline?).'));
    };
    document.body.appendChild(s);
  });
  return _pyLoadPromise;
}
async function runPython(code, inputs = []) {
  const py = await loadPyodideOnce();
  let output = '';
  const queue = Array.isArray(inputs) ? [...inputs] : [];
  py.setStdout({
    batched: s => {
      output += s;
    }
  });
  py.setStderr({
    batched: s => {
      output += s;
    }
  });
  py.setStdin({
    stdin: () => queue.length ? queue.shift() : ''
  });
  try {
    await py.runPythonAsync(code);
    return {
      output: output.replace(/\n$/, ''),
      error: null
    };
  } catch (e) {
    return {
      output: output.replace(/\n$/, ''),
      error: String(e.message || e)
    };
  }
}

// --- Beginner-friendly error humaniser ------------------------------
function humanizeError(err) {
  if (!err) return null;
  const text = String(err);
  const nameMatch = text.match(/NameError.*name '([^']+)' is not defined/);
  if (nameMatch) {
    const n = nameMatch[1];
    return {
      title: 'Python doesn\'t know what "' + n + '" is.',
      why: 'This usually means one of these:',
      hints: ['You forgot quotes around text — try "' + n + '" instead of ' + n, 'You spelled a variable name differently somewhere else', 'You tried to use the variable before creating it']
    };
  }
  if (/SyntaxError/.test(text)) {
    if (/EOL while scanning|unterminated string/.test(text)) {
      return {
        title: 'A quote is missing.',
        why: 'Every " needs a matching " on the same line.',
        hints: ['Look for text that starts with " but doesn\'t end with one.']
      };
    }
    if (/expected .:.|expected \':\'/.test(text)) {
      return {
        title: 'A colon is missing.',
        why: 'if, for, while and def each need a : at the end of that line.',
        hints: ['Example: if x > 0:  ← the colon is important', 'Then indent the next line 4 spaces.']
      };
    }
    if (/was never closed|unexpected EOF/.test(text)) {
      return {
        title: 'Something was never closed.',
        why: 'You opened a bracket, quote or block but forgot to close it.',
        hints: ['Count your ( and ) — do they match?', 'Same for " and \'.']
      };
    }
    if (/invalid syntax/.test(text)) {
      return {
        title: 'There\'s a small syntax problem.',
        why: 'Python found something it doesn\'t recognise.',
        hints: ['Check the line number Python mentioned.', 'Remember: = assigns, == compares.']
      };
    }
    return {
      title: 'A small syntax problem.',
      why: 'Python couldn\'t understand part of your code.',
      hints: ['Check brackets, quotes and punctuation.']
    };
  }
  if (/IndentationError|TabError/.test(text)) {
    return {
      title: 'Check your indentation.',
      why: 'Lines inside a for, while, if or def must be indented (usually 4 spaces).',
      hints: ['Use the Tab key or 4 spaces to indent.', 'Every line inside the block should have the same indent.']
    };
  }
  if (/TypeError/.test(text)) {
    if (/(str.*int|int.*str|concatenate str.*int|unsupported operand.*str.*int|unsupported operand.*int.*str)/.test(text)) {
      return {
        title: 'You\'re mixing text and numbers.',
        why: 'Python won\'t combine "Hello" and a number directly with +.',
        hints: ['Use str(number) to turn a number into text.', 'Or use an f-string: f"Hello {age}"']
      };
    }
    if (/takes.*positional argument|missing.*required/.test(text)) {
      return {
        title: 'A function is missing something.',
        why: 'You called a function without the right number of arguments.',
        hints: ['Check what goes inside the ( ).']
      };
    }
    return {
      title: 'A type mismatch.',
      why: 'You used an operation that doesn\'t work for these types.',
      hints: ['Check whether your variables are numbers, text, lists, etc.']
    };
  }
  if (/ValueError/.test(text)) {
    if (/invalid literal for int/.test(text)) {
      return {
        title: 'That value can\'t become an integer.',
        why: 'You used int() on something that isn\'t a whole number.',
        hints: ['int("12") works. int("hello") doesn\'t.', 'For decimals, try float() instead.']
      };
    }
    return {
      title: 'A value doesn\'t fit.',
      why: 'A function got a value it can\'t work with.',
      hints: ['Check what value you\'re passing in.']
    };
  }
  if (/ZeroDivisionError/.test(text)) {
    return {
      title: 'You can\'t divide by zero.',
      why: '/, // and % all fail when the right side is 0.',
      hints: ['Check the number you\'re dividing by.']
    };
  }
  if (/EOFError|input\(\)/i.test(text)) {
    return {
      title: 'Python asked for input but got none.',
      why: 'Your code used input() but no input was provided.',
      hints: ['Type your test input in the Input box (one per line) before running.']
    };
  }
  if (/AttributeError/.test(text)) {
    return {
      title: 'That name isn\'t part of this thing.',
      why: 'You tried to use a method or attribute that doesn\'t exist on that object.',
      hints: ['Check spelling — Python is case-sensitive.']
    };
  }
  const lastLine = text.split('\n').filter(l => l.trim()).pop() || 'Unknown error';
  return {
    title: 'Python found a problem.',
    why: lastLine.slice(0, 220),
    hints: ['Read the message carefully.', 'Check the line number Python mentioned.']
  };
}

function matchExpected(actual, expected, mode) {

}

// --- Python code generator -------------------------------------------
function bcToPython(blocks, indent) {

    switch (b.type) {
      case 'print':
        return pad + 'print(' + bcPyExpr(b.text) + ')';
      case 'set':

      case 'change':
        return pad + b.varName + ' = ' + b.varName + ' + ' + (b.by || 0);
      case 'ask':
        return pad + b.varName + ' = input(' + JSON.stringify(b.prompt || '') + ')';
      case 'if':

      case 'while':

      case 'move':
        return pad + 'robot.forward(' + b.steps + ')';
      case 'turn':
        return pad + 'robot.turn(' + b.degrees + ')';
      case 'pen':

    }

}

  if (!c || !c.op) return 'True';

}
